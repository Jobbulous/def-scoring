<html lang="th">
<head>
<meta charset="utf-8">

<title>ใบให้คะแนนโครงการกองทุนดีอี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: score sheet on the left, sticky tally on the right; stacks on phones with a bottom tally bar */
:root {
  --bg: #f3f5f2; --surface: #ffffff; --surface-2: #eaeee9; --ink: #1a231f; --muted: #57645e;
  --line: #d6ddd6; --accent: #1d6656; --accent-soft: #dfeee8; --accent-ink: #ffffff;
  --warn: #9a5b12; --warn-soft: #f7ead6; --bad: #a8352a; --bad-soft: #f7e2de; --ok: #2b7445; --ok-soft: #e2f1e6;
  --f-display: "Bai Jamjuree", "IBM Plex Sans Thai", "Leelawadee UI", "Thonburi", sans-serif;
  --f-body: "IBM Plex Sans Thai", "Leelawadee UI", "Thonburi", "Noto Sans Thai", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111715; --surface: #18201d; --surface-2: #212b27; --ink: #e4ebe7; --muted: #9babA4;
  --line: #2d3934; --accent: #5ec2a8; --accent-soft: #1b3a32; --accent-ink: #0b1411;
  --warn: #e3a95e; --warn-soft: #382a16; --bad: #f08c7e; --bad-soft: #3c1f1b; --ok: #71c792; --ok-soft: #183323;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111715; --surface: #18201d; --surface-2: #212b27; --ink: #e4ebe7; --muted: #9babA4;
  --line: #2d3934; --accent: #5ec2a8; --accent-soft: #1b3a32; --accent-ink: #0b1411;
  --warn: #e3a95e; --warn-soft: #382a16; --bad: #f08c7e; --bad-soft: #3c1f1b; --ok: #71c792; --ok-soft: #183323;
  color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 96px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.3; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

header.top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
header.top h1 { font-size: 26px; font-weight: 700; letter-spacing: .01em; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
.status { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

.projbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 14px 0; }
.projbar label.lbl { font-size: 13px; color: var(--muted); }
select, input[type=text], input[type=number], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
#proj { min-width: 0; max-width: 100%; flex: 1 1 260px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.switch { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }

.newproj { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); align-items: end; margin-bottom: 12px; }
.newproj .field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.newproj .actions { display: flex; gap: 8px; }
.banner { border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; background: var(--warn-soft); color: var(--warn); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tabs a { padding: 10px 14px; text-decoration: none; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; align-items: start; }
@media (max-width: 920px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.side { margin-bottom: 30px; }
.side-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 2px solid var(--ink); }
.side-head h2 { font-size: 20px; font-weight: 700; }
.side-head .q { font-size: 13px; color: var(--muted); }
.topic { margin-top: 18px; }
.topic-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 6px 0 10px; }
.topic-head h3 { font-size: 16.5px; font-weight: 600; }
.topic-head .score { white-space: nowrap; font-size: 15px; }
.subs { display: grid; gap: 10px; }

.sub { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; min-width: 0; }
.sub-head > div:first-child { min-width: 0; }
.chip.wrap { white-space: normal; }
.sub.done { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.sub-head { display: flex; gap: 10px; justify-content: space-between; align-items: flex-start; }
.sub-title { font-weight: 600; font-size: 15.5px; }
.sub-score { font-size: 18px; white-space: nowrap; }
.sub-score .of { font-size: 13px; color: var(--muted); }
details.crit { font-size: 13.5px; color: var(--muted); }
details.crit summary { cursor: pointer; width: fit-content; }
details.crit ul { margin: 6px 0; padding-left: 20px; }
details.crit p { margin: 4px 0; }
.levels { display: grid; gap: 6px; }
.lv { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
.lv:hover { border-color: var(--accent); }
.lv input { position: absolute; opacity: 0; pointer-events: none; }
.lv .pts { font-family: var(--f-display); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; text-align: center; border-radius: 6px; background: var(--surface-2); padding: 2px 0; }
.lv .txt { font-size: 14px; }
.lv.on { background: var(--accent-soft); border-color: var(--accent); }
.lv.on .pts { background: var(--accent); color: var(--accent-ink); }
.lv:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.lv .tag { font-size: 11.5px; color: var(--muted); }
.note-lines { font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; }
.extra { display: grid; gap: 8px; }
.pend-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13.5px; }
.pend-box { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr) auto; background: var(--warn-soft); border-radius: 8px; padding: 10px; }
.pend-box label { font-size: 12.5px; color: var(--warn); display: grid; gap: 2px; }
.pend-box input, .pend-box select { background: var(--surface); }
textarea { width: 100%; min-height: 40px; resize: vertical; font-size: 14px; }
.clear { font-size: 12.5px; background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; }

aside.tally { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 14px; }
@media (max-width: 920px) { aside.tally { position: static; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.total { display: flex; align-items: baseline; gap: 8px; }
.total .big { font-size: 44px; font-weight: 700; line-height: 1; }
.total .of { color: var(--muted); }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
.bar b { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--warn) 45%, transparent); border-radius: 3px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 13.5px; }
.trow .n { font-variant-numeric: tabular-nums; font-family: var(--f-display); }
.trow .bar { grid-column: 1 / -1; }
.trow.sideline { font-weight: 600; font-size: 14px; margin-top: 4px; }
.obs { display: grid; gap: 6px; font-size: 13.5px; margin: 0; padding: 0; list-style: none; }
.obs li { display: flex; gap: 8px; align-items: flex-start; }
.card h3 { font-size: 15px; font-weight: 600; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.bottombar { display: none; }
@media (max-width: 920px) {
  .bottombar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; }
  .bottombar .big { font-size: 22px; font-weight: 700; }
}

.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table.cmp { border-collapse: collapse; width: 100%; font-size: 14px; }
table.cmp th, table.cmp td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.cmp th:first-child, table.cmp td:first-child { text-align: left; white-space: normal; min-width: 200px; }
table.cmp thead th { font-weight: 600; background: var(--surface-2); position: sticky; top: 0; }
table.cmp td { font-variant-numeric: tabular-nums; }
table.cmp tr.sidel td { font-weight: 600; background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
table.cmp tr.totl td { font-weight: 700; font-size: 15px; }
table.cmp tr.flag td.spread { color: var(--warn); font-weight: 600; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; color: var(--muted); }
.legend { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
@media (prefers-reduced-motion: no-preference) { .lv, .btn { transition: border-color .12s, background .12s; } }
</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">กองทุนพัฒนาดิจิทัลเพื่อเศรษฐกิจและสังคม · ม.26(1) / 26(2)</div>
      <h1>ใบให้คะแนนโครงการ</h1>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="status-text">กำลังเชื่อมต่อที่เก็บข้อมูล…</span></div>
  </header>

  <div class="projbar">
    <label class="lbl" for="proj">โครงการ</label>
    <select id="proj" disabled><option>กำลังโหลดรายชื่อโครงการ…</option></select>
    <span id="proj-kind" class="chip accent" hidden></span>
    <label class="switch" id="market-wrap" hidden title="ข้อ ๒.๒ง เริ่มใช้ปีงบ 2570 เมื่อเปิด ข้อ ก ข ค จะกลับเป็นเต็ม 3 คะแนน">
      <input type="checkbox" id="market"> ใช้ข้อ ๒.๒ง เทียบราคาตลาด (ปีงบ 2570)
    </label>
    <button class="btn" id="btn-new" type="button">+ เพิ่มโครงการ</button>
  </div>

  <form class="newproj" id="newproj" hidden>
    <label class="field">รหัสโครงการ<input type="text" id="np-code" placeholder="เช่น PR69010228" required></label>
    <label class="field" style="grid-column: span 2">ชื่อโครงการ<input type="text" id="np-name" required></label>
    <label class="field">ประเภท
      <select id="np-kind"><option value="26(1)">ม.26(1) โครงการ/กิจกรรม</option><option value="26(2)">ม.26(2) วิจัยและพัฒนา</option></select></label>
    <label class="field">งบประมาณ (บาท)<input type="number" id="np-budget" min="0" step="1"></label>
    <div class="actions"><button class="btn primary" type="submit">บันทึกโครงการ</button><button class="btn" type="button" id="np-cancel">ยกเลิก</button></div>
    <div class="small" id="np-err" style="grid-column: 1 / -1; color: var(--bad)" hidden></div>
  </form>

  <div class="banner" id="ro-banner" hidden>คุณดูได้อย่างเดียว ให้เจ้าของเพิ่มสิทธิ์เป็น Contributor ขึ้นไปจึงจะบันทึกคะแนนได้</div>

  <nav class="tabs" aria-label="มุมมอง">
    <a href="#score" id="tab-score" aria-current="page">ให้คะแนน</a>
    <a href="#compare" id="tab-compare">เทียบผู้ประเมิน</a>
  </nav>

  <section id="view-score">
    <div class="grid">
      <div id="form"></div>
      <aside class="tally" id="tally"></aside>
    </div>
  </section>

  <section id="view-compare" hidden>
    <div id="compare"></div>
  </section>
</div>

<div class="bottombar" id="bottombar">
  <div><span class="big num" id="bb-total">0</span> <span class="muted">/ 100</span></div>
  <div class="muted small" id="bb-progress"></div>

const $ = id => document.getElementById(id);

const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);

/* ---------- state ---------- */
const S = {
  mode: 'loading',           // loading | db | local
  db: null, user: null, uid: null, canWrite: true,

function blankEval() { return { levels: {}, pending: {}, notes: {} }; }
function proj() { return S.projects.get(S.pid) || { code: '', name: '', kind: '26(1)', market: false }; }

/* ---------- rubric rules ---------- */
function effMax(sub, p) {
  p = p || proj();
  if (sub.id === '2.2ง') return p.market ? 3 : 0;
  if (sub.plus) return p.market ? sub.max : sub.max + 1;
  return sub.max;
}
function levelsFor(sub, p) {
  p = p || proj();
  const lad = (p.kind === '26(2)' && sub.ladder262) ? sub.ladder262 : sub.ladder;
  let lv = lad.levels.filter(l => !(l.plus && p.market));
  if (!lv.some(l => l.v === 0)) lv = [{ v: 0, t: 'ไม่ปรากฏ หรือยังไม่ถึงขั้นต่ำสุดของข้อนี้', added: true }, ...lv];
  return { levels: lv, notes: lad.notes, is262: lad === sub.ladder262 };
}
function scoreOf(ev, sub, p) {
  const v = ev.levels[sub.id];
  if (typeof v !== 'number') return null;
  return Math.min(v, effMax(sub, p));
}
function potentialOf(ev, sub, p) {
  const s = scoreOf(ev, sub, p);
  const pd = ev.pending[sub.id];
  if (pd && pd.on && typeof pd.max === 'number') return Math.max(s || 0, Math.min(pd.max, effMax(sub, p)));
  return s || 0;
}
function activeSubs(p) { return SUBS.filter(x => effMax(x, p) > 0); }
function tallies(ev, p) {
  p = p || proj();
  const out = { total: 0, pot: 0, answered: 0, count: 0, topic: {}, side: {} };
  for (const x of activeSubs(p)) {
    const s = scoreOf(ev, x, p);
    out.count++; if (s != null) out.answered++;
    const v = s || 0, pv = potentialOf(ev, x, p);
    out.total += v; out.pot += pv;
    out.topic[x.topic.id] = (out.topic[x.topic.id] || 0) + v;
    out.side[x.side.id] = (out.side[x.side.id] || 0) + v;
    out['pt' + x.topic.id] = (out['pt' + x.topic.id] || 0) + pv;
  }
  return out;
}

const LS = {

let saveTimer = null, saving = Promise.resolve(), parentReady = false;
function queueSave() {
  if (!S.canWrite || !S.pid) return;

  clearTimeout(saveTimer);

}
async function doSave() {
  const pid = S.pid, body = { pid, levels: S.mine.levels, pending: S.mine.pending, notes: S.mine.notes, updatedAt: Date.now() };
  if (S.mode === 'local') { LS.set('eval:' + pid, body); setStatus('ok', 'บันทึกในเครื่องนี้แล้ว'); return; }
  if (S.mode !== 'db') return;
  try {
    if (!parentReady) { await S.db.doc('evals/' + S.uid).set({ updatedAt: Date.now() }); parentReady = true; }
    await S.db.doc('evals/' + S.uid + '/p/' + pid).set(body);
    setStatus('ok', 'บันทึกแล้ว · ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }));
  } catch (e) {
    if (e && e.code === 'invalid_argument') { S.canWrite = false; applyWriteState(); setStatus('bad', 'บันทึกไม่ได้: บัญชีนี้ไม่มีสิทธิ์เขียน'); }
    else if (e && e.code === 'quota_exceeded') setStatus('bad', 'ที่เก็บข้อมูลเต็ม ลบโครงการเก่าก่อน');
    else setStatus('bad', 'บันทึกไม่สำเร็จ ลองแก้คะแนนอีกครั้ง');
  }
}

  }

    for (const t of s.topics) { const te = $('topic-' + t.id); if (te) te.textContent = fmt(T.topic[t.id] || 0) + ' / ' + t.max; }

  chk(T.total >= 60, 'คะแนนรวม ' + fmt(T.total) + (T.total >= 60 ? ' ถึง' : ' ต่ำกว่า') + 'เกณฑ์ขั้นต่ำ 60');

/* ---------- export ---------- */
function rows() {

  catch (e) { $('copy-msg').textContent = 'คัดลอกอัตโนมัติไม่ได้ในหน้าต่างนี้ ลองใช้ปุ่มดาวน์โหลด CSV'; }
}
async function saveCsv() {
  const csv = '﻿' + rows().map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  if (!S.downloads) {
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const link = el('a', { href: url, download: 'คะแนน_' + (proj().code || S.pid) + '.csv' }); document.body.append(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000); $('copy-msg').textContent = 'ดาวน์โหลดไฟล์แล้ว'; return;
  }
  try { const r = await S.downloads.save({ filename: 'คะแนน_' + (proj().code || S.pid) + '.csv', data: csv }); if (r && r.status === 'saved') $('copy-msg').textContent = 'บันทึกไฟล์แล้ว'; }
  catch (e) { if (e && e.code !== 'cancelled') $('copy-msg').textContent = 'บันทึกไฟล์ไม่สำเร็จ'; }
}

/* ---------- compare ---------- */
function subscribeOthers() {
  unsubOthers.forEach(u => u()); unsubOthers = [];
  if (S.mode !== 'db' || !S.pid) return;
  const pid = S.pid;
  for (const uid of S.evaluators || []) {
    if (uid === S.uid) continue;
    unsubOthers.push(S.db.doc('evals/' + uid + '/p/' + pid).onSnapshot(snap => {
      if (pid !== S.pid) return;
      if (snap.exists) S.others.set(uid, normEval(snap.data())); else S.others.delete(uid);
      if (S.tab === 'compare') renderCompare();
    }, () => {}));
  }
}
async function renderCompare() {
  const host = $('compare'); host.textContent = '';
  const p = proj();
  if (!S.pid) { host.append(el('div', { class: 'empty', text: 'เลือกหรือเพิ่มโครงการก่อน' })); return; }
  const people = [[S.uid || 'me', S.mine, true], ...[...S.others.entries()].map(([u, e]) => [u, e, false])];
  if (S.user && people.length > 1) { try { const ps = await S.user.profiles(people.map(x => x[0]).filter(u => u !== 'me')); for (const [k, v] of Object.entries(ps || {})) S.names[k] = v && v.name; } catch (e) { /* names stay generic */ } }
  if (S.tab !== 'compare') return;
  host.textContent = '';
  if (S.mode !== 'db') host.append(el('div', { class: 'banner', text: 'เวอร์ชันนี้เก็บคะแนนไว้ในเบราว์เซอร์ของแต่ละคน จึงเห็นเฉพาะคะแนนของคุณ ให้ผู้ประเมินแต่ละคนกด "ดาวน์โหลด CSV" แล้วรวมไฟล์ใน Excel' }));
  const Ts = people.map(([u, e]) => tallies(e, p));
  const head = el('tr', null, el('th', { text: 'หัวข้อ' }),
    people.map(([u, , me], i) => el('th', { text: (me ? 'คุณ' : (S.names[u] || 'ผู้ประเมิน ' + (i + 1))) })),
    el('th', { text: 'เฉลี่ย' }), el('th', { text: 'ส่วนต่าง' }));
  const body = el('tbody');
  const line = (label, max, vals, cls) => {
    const mean = vals.reduce((a, b) => a + b, 0) / vals.length, spread = Math.max(...vals) - Math.min(...vals);
    const flag = vals.length > 1 && spread > 0.2 * max;
    body.append(el('tr', { class: (cls || '') + (flag ? ' flag' : '') }, el('td', { text: label }),
      vals.map(v => el('td', { text: fmt(v) })), el('td', { text: fmt(mean) }),
      el('td', { class: 'spread' }, fmt(spread), flag ? el('span', { class: 'chip warn', style: 'margin-left:6px', text: 'ทบทวน' }) : null)));
  };
  for (const s of SIDES) {
    line(s.label + '. ' + s.name + ' (' + s.max + ')', s.max, Ts.map(T => T.side[s.id] || 0), 'sidel');
    for (const t of s.topics) line(t.label + ' ' + t.name + ' (' + t.max + ')', t.max, Ts.map(T => T.topic[t.id] || 0));
  }
  line('รวม (100)', 100, Ts.map(T => T.total), 'totl');
  body.append(el('tr', null, el('td', { class: 'muted', text: 'ให้คะแนนแล้ว' }), Ts.map(T => el('td', { class: 'muted', text: T.answered + '/' + T.count })), el('td'), el('td')));
  host.append(el('div', { class: 'tablewrap' }, el('table', { class: 'cmp' }, el('thead', null, head), body)));
  host.append(el('p', { class: 'legend', text: people.length > 1
    ? 'ป้าย "ทบทวน" ขึ้นเมื่อคะแนนสูงสุดกับต่ำสุดต่างกันเกิน 20% ของคะแนนเต็มของหัวข้อนั้น ควรให้ผู้ประเมินคุยกันก่อนสรุป'
    : 'ยังไม่มีผู้ประเมินคนอื่นให้คะแนนโครงการนี้ แชร์ลิงก์หน้านี้ให้ผู้ประเมินอย่างน้อย 3 คน (สิทธิ์ Contributor) แล้วตารางจะเทียบให้เอง' }));
}

/* ---------- tabs ---------- */
function setTab(t) {
  S.tab = t === 'compare' ? 'compare' : 'score';
  $('view-score').hidden = S.tab !== 'score'; $('view-compare').hidden = S.tab !== 'compare';
  $('tab-score').toggleAttribute('aria-current', S.tab === 'score'); if (S.tab === 'score') $('tab-score').setAttribute('aria-current', 'page');
  $('tab-compare').toggleAttribute('aria-current', S.tab === 'compare'); if (S.tab === 'compare') $('tab-compare').setAttribute('aria-current', 'page');
  $('bottombar').hidden = S.tab !== 'score';
  if (S.tab === 'compare') renderCompare();
}
window.addEventListener('hashchange', () => setTab(location.hash.slice(1)));

/* ---------- controls ---------- */
$('proj').addEventListener('change', e => selectProject(e.target.value));
$('btn-new').addEventListener('click', () => { $('newproj').hidden = false; $('np-code').focus(); });
$('np-cancel').addEventListener('click', () => { $('newproj').hidden = true; });
$('newproj').addEventListener('submit', async e => {
  e.preventDefault();
  const code = $('np-code').value.trim(), name = $('np-name').value.trim();
  if (!code || !name) { $('np-err').hidden = false; $('np-err').textContent = 'กรอกรหัสและชื่อโครงการก่อน'; return; }
  const pid = pidOf(code);
  const body = { code, name, kind: $('np-kind').value, budget: Number($('np-budget').value) || 0, market: false, createdAt: Date.now() };
  $('np-err').hidden = true;
  if (S.mode === 'db') {
    try { await S.db.doc('projects/' + pid).set(body); }
    catch (er) { $('np-err').hidden = false; $('np-err').textContent = er && er.code === 'invalid_argument' ? 'บัญชีนี้ไม่มีสิทธิ์เพิ่มโครงการ' : 'เพิ่มโครงการไม่สำเร็จ ลองอีกครั้ง'; return; }
  } else { S.projects.set(pid, body); LS.set('projects', Object.fromEntries(S.projects)); }
  S.projects.set(pid, body);
  $('newproj').reset(); $('newproj').hidden = true;
  renderProjects(); await selectProject(pid); $('proj').value = pid;
});
$('market').addEventListener('change', async e => {
  const p = S.projects.get(S.pid); if (!p) return;
  p.market = e.target.checked; renderForm(); renderAll();
  if (S.mode === 'db') { try { await S.db.doc('projects/' + S.pid).update({ market: p.market }); } catch (er) { setStatus('bad', 'เปลี่ยนการตั้งค่าโครงการไม่สำเร็จ'); } }
  else LS.set('projects', Object.fromEntries(S.projects));
});
function applyWriteState() {
  $('ro-banner').hidden = S.canWrite; $('btn-new').disabled = !S.canWrite; $('market').disabled = !S.canWrite;
  renderForm(); renderAll();
}

/* ---------- boot ---------- */
renderForm(); renderAll(); setTab(location.hash.slice(1));

function startLocal() {
  S.mode = 'local';
  const saved = LS.get('projects', null);
  S.projects = new Map(Object.entries(saved || {}));
  if (!saved) S.projects.set('PR69010228', { code: 'PR69010228', name: 'โครงสร้างพื้นฐานดิจิทัลแบบเปิดสำหรับการจำลองน้ำท่วมเมือง (นำร่องหาดใหญ่)', kind: '26(2)', budget: 9924298, market: false });
  setStatus('warn', 'เก็บคะแนนไว้ในเบราว์เซอร์นี้เท่านั้น');
  renderProjects(); renderForm(); renderAll();
}
(async () => {
  let db = null, user = null;
  try { [db, user] = await Promise.all([window.claude ? window.claude.use('db') : null, window.claude ? window.claude.use('user') : null]); } catch (e) { db = null; }
  try { S.downloads = window.claude ? await window.claude.use('downloads') : null; } catch (e) { S.downloads = null; }
  S.user = user;
  const uid = user ? await user.id().catch(() => null) : null;
  if (!db || !uid) { startLocal(); return; }
  S.db = db; S.uid = uid; S.mode = 'db';
  const can = await user.can('data.write').catch(() => null);
  S.canWrite = can !== false;
  applyWriteState();
  setStatus('ok', 'เชื่อมต่อแล้ว คะแนนบันทึกอัตโนมัติ');
  db.collection('projects').onSnapshot(snap => {
    S.projects = new Map(snap.docs.map(d => [d.id, { ...d.data() }]));
    renderProjects(); renderAll();
  }, () => setStatus('bad', 'โหลดรายชื่อโครงการไม่สำเร็จ'));
  db.collection('evals').onSnapshot(snap => {
    const ids = snap.docs.map(d => d.id);
    if (ids.includes(S.uid)) parentReady = true;
    const changed = JSON.stringify(ids) !== JSON.stringify(S.evaluators || []);
    S.evaluators = ids; if (changed) subscribeOthers();
  }, () => {});
})();
})();
</script>
